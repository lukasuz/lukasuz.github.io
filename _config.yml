# -----------------------------------------------------------------------------
# Site
# -----------------------------------------------------------------------------
title: Lukas Uzolas
tagline: Computer Graphics · Computer Vision · Machine Learning
description: Personal website of Lukas Uzolas
email: lukas@uzolas.com
url: https://lukas.uzolas.com   # used by the sitemap, robots.txt and the 404 redirect
baseurl: ""

# -----------------------------------------------------------------------------
# Links — rendered as chips under the name, in this order.
# Add or remove a line to change the chips.
# -----------------------------------------------------------------------------
links:
  - { label: CV,             url: /assets/pdf/CV_Lukas_Uzolas.pdf }
  - { label: LinkedIn,       url: "https://www.linkedin.com/in/lukas-uzolas" }
  - { label: Google Scholar, url: "https://scholar.google.com/citations?user=d21AHFQAAAAJ" }
  - { label: GitHub,         url: "https://github.com/lukasuz" }
  - { label: Email,          url: "mailto:lukas@uzolas.com" }

# News items live in _data/news.yml.
# Uncomment to show only the N most recent items (all are shown otherwise).
news_limit: 5

# -----------------------------------------------------------------------------
# Jekyll
# -----------------------------------------------------------------------------
permalink: /blog/:year/:title/   # keeps the URLs of the two old blog posts
include: [_pages]
exclude: [bin, vendor, LICENSE]
keep_files: [.git]
plugins: [jekyll-sitemap]

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "assets/**/*.*" }
    values: { sitemap: false }
